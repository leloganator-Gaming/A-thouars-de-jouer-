<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171323">
  <title>Site fermé</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #171323; color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: min(100%, 520px); padding: 48px 28px; text-align: center;
      background: #211a31; border: 1px solid #493765; border-radius: 22px;
      box-shadow: 0 18px 60px #0006;
    }
    .icon { font-size: 48px; margin-bottom: 18px; }
    h1 { margin: 0 0 14px; font-size: clamp(30px, 7vw, 42px); }
    p { margin: 0; color: #c9bde5; font-size: 17px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">🔒</div>
    <h1>Site fermé</h1>
    <p>Ce site n'est plus disponible.</p>
  </main>
</body>
</html>
